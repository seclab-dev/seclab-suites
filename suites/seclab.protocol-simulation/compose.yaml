services:
  seclab-protocol-simulation:
    image: guowenju/seclab-protocol-simulation:0.1.0-alpha.2
    container_name: seclab-protocol-simulation
    init: true
    restart: unless-stopped
    environment:
      PORT: "8080"
      SECLAB_SUITE_DATA_DIR: /data
      SECLAB_FRONTEND_DIR: /app/public
      SECLAB_SIM_ENGINE_IMAGE: guowenju/seclab-protocol-simulation-engine:0.1.0-alpha.2
      SECLAB_SIM_CALLBACK_URL: http://seclab-protocol-simulation:8080/internal/events
    labels:
      seclab.owner: suite
      seclab.suite.id: seclab.protocol-simulation
      seclab.service.role: web
    expose:
      - "8080"
    networks:
      - seclab-suite-network
    volumes:
      - seclab-protocol-simulation-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  seclab-protocol-simulation-data:
    name: seclab-protocol-simulation-data
    labels:
      seclab.owner: suite

networks:
  seclab-suite-network:
    external: true
    name: seclab-suite-network
